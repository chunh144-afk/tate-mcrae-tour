<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miss Possessive - Tate McRae</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

 <main class="poster">

  <img
    src="images/tate number 2.png"
    alt="Tate McRae Miss Possessive Tour Poster"
    class="poster-image"
  >

  <!-- Six clickable jewelry charms -->
<details class="jewelry-info star">
  <summary aria-label="Show New York concert details"></summary>

  <div class="charm-details">
    <h2>NEW YORK</h2>
    <p>SEP 3, 2025</p>
    <p>Madison Square Garden</p>
  </div>
</details>

  <details class="jewelry-info heart">
  <summary aria-label="Show Boston concert details"></summary>

  <div class="charm-details">
    <h2>BOSTON</h2>
    <p>August 26, 2025</p>
    <p>TD Garden</p>
  </div>
</details>

 <details class="jewelry-info cross">
  <summary aria-label="Show Toronto concert details"></summary>

  <div class="charm-details">
    <h2>TORONTO</h2>
    <p>August 19, 2025</p>
    <p>Scotiabank Arena</p>
  </div>
</details>

<details class="jewelry-info key">
  <summary aria-label="Show Miami concert details"></summary>

  <div class="charm-details">
    <h2>MIAMI</h2>
    <p>September 18, 2025</p>
    <p>Kaseya Center</p>
  </div>
</details>

 <details class="jewelry-info butterfly">
  <summary aria-label="Show Los Angeles concert details"></summary>

  <div class="charm-details">
    <h2>LOS ANGELES</h2>
    <p>September 26, 2025</p>
    <p>Kia Forum</p>
  </div>
</details>

<details class="jewelry-info tag">
  <summary aria-label="Show Chicago concert details"></summary>

  <div class="charm-details">
    <h2>CHICAGO</h2>
    <p>August 15, 2025</p>
    <p>United Center</p>
  </div>
</details>

  <!-- Information revealed when clicking -->

  <div class="info-panel" id="info-panel" hidden>
    <button class="close" id="close-panel"
      aria-label="Close concert details">×</button>
    <h2 id="info-city"></h2>
    <p id="info-date"></p>
    <p id="info-venue"></p>
  </div>

</main>

</body>
</html>
